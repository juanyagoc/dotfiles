set-option -ag terminal-overrides ",xterm*:Tc"
set-option -g default-terminal "tmux-256color"
set -gq allow-passthrough on
set-option -sa terminal-features ',alacritty:RGB' # esto no se si hace algo

set-window-option -g wrap-search on

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

set -g mouse on

# To reload the tmux conf press the bind key (C-b) and I

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim style pane selection
bind h select-pane -L # Left pane
bind j select-pane -D # Down pane 
bind k select-pane -U # Up pane
bind l select-pane -R # Right pane
bind b set-option status # Toggle status bar

# Split keybinds p and o
bind 'p' split-window -v -c "#{pane_current_path}"
bind 'o' split-window -h -c "#{pane_current_path}"


# Bind-key + r to enter the resize-pane mode
bind r switch-client -T resize-mode \;\
         display-message "RESIZE MODE: w/a/s/d to resize, q to quit"

bind -T resize-mode a resize-pane -L 3 \;\
                      switch-client -T resize-mode
bind -T resize-mode d resize-pane -R 3 \;\
                      switch-client -T resize-mode
bind -T resize-mode w resize-pane -U 3 \;\
                      switch-client -T resize-mode
bind -T resize-mode s resize-pane -D 3 \;\
                      switch-client -T resize-mode
bind -T resize-mode q switch-client -T root \;\
                      display-message "Exited resize mode"

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "christoomey/vim-tmux-navigator"
# multi theme plugin (kanagawa, dracula, catppuccin & tokyonight)
#set -g @plugin "Nybkox/tmux-ukiyo"
set -g @plugin "tmux-plugins/tmux-yank"

#set -g @ukiyo-theme "kanagawa/dragon"
#set -g @ukiyo-ignore-window-colors true
#set -g @ukiyo-plugins "network ssh-session")

# ---------------------------------------------------------------------------
# Status bar minimalista (sin fondos de color)
# ---------------------------------------------------------------------------

set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style 'fg=#a6a69c,bg=default'

# Izquierda: vacía (sin nombre de sesión)
set -g status-left ''

# Ventanas: "N:nombre" + flag (- = anterior, * = activa)
set -g window-status-separator '   '
set -g window-status-format         '#[fg=#c4b28a,bold]#I#[fg=#a6a69c,nobold]:#W#F'
set -g window-status-current-format '#[fg=#c4746e,bold]#I#[fg=#c5c9c5,bold]:#W#F'
set -g window-status-style 'default'
set -g window-status-current-style 'default'

# Derecha: IP privada (macOS: Wi-Fi en0, si no en1) + usuario@equipo
set -g status-right-length 60
set -g status-right '#[fg=#a6a69c]#(ipconfig getifaddr en0 || ipconfig getifaddr en1)  #(whoami)@#h '

run "~/.config/tmux/plugins/tpm/tpm"

