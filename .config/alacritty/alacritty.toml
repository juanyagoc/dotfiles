[general]
import = ["~/.config/alacritty/themes/kanagawa.toml"]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
padding.x = 0
padding.y = 0
# decorations = "Buttonless"
startup_mode = "Maximized"
opacity = 1

[terminal.shell]
program = "/bin/zsh"
args = ["-l", "-c", "/opt/homebrew/bin/tmux new-session -A -s main \\; send-keys 'fastfetch' C-m"]

[mouse]
hide_when_typing = true

[font]
normal = { family = "Hack Nerd Font Mono", style = "Regular" }
bold   = { family = "Hack Nerd Font Mono", style = "Bold" }
italic = { family = "Hack Nerd Font Mono", style = "Italic" }
bold_italic = { family = "Hack Nerd Font Mono", style = "Bold Italic" }
size = 16

[cursor]
unfocused_hollow = true
style = { blinking = "Never" }

